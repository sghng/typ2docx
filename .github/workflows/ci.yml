name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preview:
    name: Deploy Pages preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Prepare Pages assets
        run: mkdir -p dist && cp index.html dist/

      - name: Deploy Pages preview
        id: deploy
        run: |
          output=$(bunx wrangler pages deploy \
            --cwd pages \
            --project-name typ2docx \
            --branch "${{ github.head_ref }}" \
            --commit-hash "${{ github.sha }}" \
            --commit-message "${{ github.event.pull_request.title }}" \
            --commit-dirty=true \
            2>&1)
          echo "$output"
          url=$(echo "$output" | grep -oP 'https://[a-f0-9]+\.typ2docx\.pages\.dev')
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post preview URL to PR
        if: steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Cloudflare Pages Preview\n\n${{ steps.deploy.outputs.url }}`
            })

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install fish shell
        uses: fish-actions/install-fish@v1

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Build with uv
        run: uv tool install .

      - name: Initialize tests
        run: just init-tests

      - name: Run tests
        run: just run-test
