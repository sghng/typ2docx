name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/typ2docx

    steps:
      - uses: actions/checkout@v6

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7

      - name: Build source distribution
        run: uv build --sdist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  generate-lock-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate lock file
        run: cargo generate-lockfile

      - name: Append lockfile to release
        uses: softprops/action-gh-release@v2
        with:
          files: Cargo.lock

  deploy-web-app:
    needs: build-and-publish
    # ubuntu-latest has Docker pre-installed, required by wrangler to build the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Deploy Container Worker
        # Builds & pushes the Docker image, then deploys the Worker + Container
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Prepare Pages assets
        # Pages deploy uploads dist/ — copy index.html there (dist/ may contain
        # Python sdist artifacts from build-and-publish but that job runs on a
        # separate runner, so dist/ is clean here)
        run: mkdir -p dist && cp index.html dist/

      - name: Deploy Pages
        # --cwd pages: use pages/wrangler.jsonc (pages_build_output_dir = ../dist)
        # Pages CLI does not support --config for a non-default path
        run: bunx wrangler pages deploy --cwd pages --project-name typ2docx --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
